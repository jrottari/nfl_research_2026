[project]
name = "nfl-research"
version = "0.1.0"
description = "Season-end NFL fantasy football research built on nflverse data"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",   # nflverse loader; returns Polars frames
    "polars>=1.0",        # nflreadpy's native frame type
    "pyarrow>=16.0",      # required by polars .to_pandas() and pandas .to_parquet()
    "pandas>=2.2",        # analysis layer
    "numpy>=2.0",
    "matplotlib>=3.8",    # notebook charts
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
nfl-research = "nfl_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
